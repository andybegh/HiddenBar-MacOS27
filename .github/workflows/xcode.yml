name: Xcode - Build

on:
  push:
    branches: ["stable"]
  pull_request:
    branches: ["stable"]

jobs:
  build:
    name: Build macOS 27 arm64 app
    # macOS 27 SDK is currently provided by GitHub's Xcode 27 preview image.
    runs-on: xcode-27

    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Build
        run: |
          xcodebuild clean build \
            -project "Hidden Bar.xcodeproj" \
            -scheme "Hidden Bar" \
            -configuration Release \
            CONFIGURATION_BUILD_DIR="$PWD/build/Release" \
            CODE_SIGNING_ALLOWED=NO \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES
      - name: Package app
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            "build/Release/Hidden Bar.app" \
            "build/Release/HiddenBar-MacOS27.zip"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: HiddenBar-MacOS27
          path: build/Release/HiddenBar-MacOS27.zip
