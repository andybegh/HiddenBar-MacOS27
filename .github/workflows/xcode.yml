name: Xcode - Build

on:
  push:
    branches: ["stable"]
  pull_request:
    branches: ["stable"]

jobs:
  build:
    name: Build macOS 27 arm64 app
    # macOS 27 SDK is currently provided by GitHub's Xcode 27 preview image.
    runs-on: xcode-27

    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Build
        run: |
          xcodebuild clean build \
            -project "Hidden Bar.xcodeproj" \
            -scheme "Hidden Bar" \
            -configuration Release \
            CONFIGURATION_BUILD_DIR="$PWD/build/Release" \
            CODE_SIGNING_ALLOWED=NO \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES
      - name: Verify app bundle
        run: |
          app="build/Release/Hidden Bar.app"
          test -x "$app/Contents/MacOS/Hidden Bar"
          test "$(plutil -extract CFBundleIdentifier raw "$app/Contents/Info.plist")" = "com.andybegh.HiddenBar"
          test "$(plutil -extract CFBundleShortVersionString raw "$app/Contents/Info.plist")" = "2.0.1"
          test "$(plutil -extract LSMinimumSystemVersion raw "$app/Contents/Info.plist")" = "27.0"
          test "$(plutil -extract LSUIElement raw "$app/Contents/Info.plist")" = "false"
      - name: Package app
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            "build/Release/Hidden Bar.app" \
            "build/Release/HiddenBar-MacOS27.zip"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: HiddenBar-MacOS27
          path: build/Release/HiddenBar-MacOS27.zip
